name: Build and Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version, e.g. 0.1.0'
        required: true
        default: '0.1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Vue plugin
        working-directory: page
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          npm install
          npm run build

      - name: Create package structure
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          PKG_NAME="opencode-v2-${VERSION}-1+mos-plugin"
          PKG_DIR="${PKG_NAME}_all"

          mkdir -p ${PKG_DIR}/usr/bin/plugins
          mkdir -p ${PKG_DIR}/usr/share/opencode-v2-plugin
          mkdir -p ${PKG_DIR}/var/www/mos-plugins/opencode-v2
          mkdir -p ${PKG_DIR}/DEBIAN

          cp opencode-backend ${PKG_DIR}/usr/bin/plugins/opencode-v2
          chmod 0755 ${PKG_DIR}/usr/bin/plugins/opencode-v2

          cp opencode-wrapper ${PKG_DIR}/usr/bin/opencode
          cp opencode-wrapper ${PKG_DIR}/usr/bin/opencode-v2
          chmod 0755 ${PKG_DIR}/usr/bin/opencode ${PKG_DIR}/usr/bin/opencode-v2

          cp opencode-backend ${PKG_DIR}/usr/share/opencode-v2-plugin/
          cp opencode-wrapper ${PKG_DIR}/usr/share/opencode-v2-plugin/
          cp functions settings.json ${PKG_DIR}/usr/share/opencode-v2-plugin/
          chmod 0755 ${PKG_DIR}/usr/share/opencode-v2-plugin/opencode-backend
          chmod 0755 ${PKG_DIR}/usr/share/opencode-v2-plugin/opencode-wrapper
          chmod 0755 ${PKG_DIR}/usr/share/opencode-v2-plugin/functions

          cp -R page/dist/opencode-v2/. ${PKG_DIR}/var/www/mos-plugins/opencode-v2/
          cp images/opencode.png ${PKG_DIR}/var/www/mos-plugins/opencode-v2/icon.png

          cat > ${PKG_DIR}/DEBIAN/control << EOF
          Package: opencode-v2-plugin
          Version: ${VERSION}-1+mos-plugin
          Architecture: all
          Maintainer: hustyanzu
          Section: utils
          Priority: optional
          Description: OpenCode v2 plugin for MOS
           OpenCode v2 with a MOS-managed runtime and optional server.
          EOF

          cat > ${PKG_DIR}/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          set -e
          PLG=/boot/optional/plugins/opencode-v2
          SHARE=/usr/share/opencode-v2-plugin
          mkdir -p "$PLG/bin" "$PLG/config" "$PLG/data" "$PLG/state"
          chmod 0755 /usr/bin/plugins/opencode-v2 /usr/bin/opencode /usr/bin/opencode-v2 2>/dev/null || true
          for f in opencode-backend opencode-wrapper functions; do
            cp -f "$SHARE/$f" "$PLG/$f"
          done
          chmod 0755 "$PLG/opencode-backend" "$PLG/opencode-wrapper" "$PLG/functions" 2>/dev/null || true
          if [ ! -f "$PLG/settings.json" ]; then
            cp -f "$SHARE/settings.json" "$PLG/settings.json"
          fi
          if [ -x "$PLG/bin/opencode" ]; then
            install -m 0755 "$PLG/bin/opencode" /usr/bin/opencode-v2.real 2>/dev/null || true
            if [ "$(jq -r '.server_enabled // false' "$PLG/settings.json" 2>/dev/null)" = "true" ] && \
               [ "$(jq -r '.auto_start // true' "$PLG/settings.json" 2>/dev/null)" = "true" ]; then
              /usr/bin/plugins/opencode-v2 start >/dev/null 2>&1 || true
            fi
          fi
          exit 0
          EOF
          chmod 0755 ${PKG_DIR}/DEBIAN/postinst

          cat > ${PKG_DIR}/DEBIAN/prerm << 'EOF'
          #!/bin/bash
          if [ -x /usr/bin/plugins/opencode-v2 ]; then
            /usr/bin/plugins/opencode-v2 stop >/dev/null 2>&1 || true
          fi
          exit 0
          EOF
          chmod 0755 ${PKG_DIR}/DEBIAN/prerm

          cat > ${PKG_DIR}/DEBIAN/postrm << 'EOF'
          #!/bin/bash
          rm -f /usr/bin/opencode-v2.real
          exit 0
          EOF
          chmod 0755 ${PKG_DIR}/DEBIAN/postrm

      - name: Build .deb package
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          PKG_NAME="opencode-v2-${VERSION}-1+mos-plugin"
          PKG_DIR="${PKG_NAME}_all"
          DEB_FILE="${PKG_NAME}_all.deb"

          dpkg-deb --build --root-owner-group ${PKG_DIR} ${DEB_FILE}
          md5sum ${DEB_FILE} | awk '{print $1}' > ${DEB_FILE}.md5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: OpenCode v2 ${{ steps.version.outputs.VERSION }}
          body: |
            ## OpenCode v2 MOS plugin ${{ steps.version.outputs.VERSION }}

            Install the plugin from the MOS Hub, then click **Install** on the plugin page.
            The OpenCode binary is downloaded from GitHub releases and checked against SHA256SUMS.
            OpenCode self-update and `/update` are disabled; use the plugin page to update.
            The OpenCode server is off by default.
          files: |
            opencode-v2-${{ steps.version.outputs.VERSION }}-1+mos-plugin_all.deb
            opencode-v2-${{ steps.version.outputs.VERSION }}-1+mos-plugin_all.deb.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}